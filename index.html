<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ATOMIA ⚛️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <h1>
            <strong>ATOMIA</strong><span>⚛️</span>
        </h1>

        <p>Explorateur de la matière interactif</p>
        <p>Cliquez sur un élément du tableau</p>

    </header>

    <main>

        <section class="search-section">

            <input
                type="search"
                id="search"
                placeholder="Rechercher un élément, symbole, numéro..."
                autocomplete="off"
            >

        </section>

        <section class="periodic-section">

            <h2>Tableau périodique</h2>

            <div
                id="periodic-table"
                class="periodic-table">
            </div>

        </section>

        <section
            id="element-view"
            class="element-view hidden">
        </section>

    </main>

    <script src="app.js"></script>

    <a
        href="https://github.com/McAlex4031/Atomia"
        class="github">
        GitHub
    </a>

    <footer>

        <p>© 2026 ATOMIA.</p>
        <p>CC0</p>
        <p>Bases de données : NUBASE, NIST, IUPAC</p>

    </footer>

</body>

</html>
